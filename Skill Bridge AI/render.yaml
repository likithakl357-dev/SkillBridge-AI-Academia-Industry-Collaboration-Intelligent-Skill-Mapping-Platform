services:
  - type: web
    name: skillbridge-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/skillbridge.db
      - key: PYTHON_VERSION
        value: 3.12.8
    disk:
      name: skillbridge-data
      mountPath: /var/data
      sizeGB: 1
